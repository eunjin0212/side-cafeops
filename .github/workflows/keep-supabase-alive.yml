name: Keep Supabase awake

# Supabase pauses free projects after 7 days without sufficient activity.
# This calls the ping() function twice a week, which writes one row to the
# keep_alive table (see supabase/migrations/20261126000000_add_keep_alive.sql).

on:
  schedule:
    # Mondays and Thursdays at 13:17 UTC. Off the hour, since GitHub delays top-of-hour runs most.
    - cron: "17 13 * * 1,4"
  workflow_dispatch: # lets you run it manually from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Missing SUPABASE_URL or SUPABASE_ANON_KEY."
            exit 1
          fi

          status=$(curl -s -o response.txt -w "%{http_code}" \
            -X POST "$SUPABASE_URL/rest/v1/rpc/ping" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -d '{}')

          echo "HTTP status: $status"
          echo "Response: $(cat response.txt)"

          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "Ping failed."
            exit 1
          fi

          echo "Supabase is awake."
